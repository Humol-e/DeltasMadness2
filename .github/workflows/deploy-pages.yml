name: Deploy sar-Madness Viewer to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sar-Madness/sar-Madness
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sar-Madness/sar-Madness/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Schema v2 catalog
        run: npm run validate

      - name: Run frontend unit tests
        run: node --test tests/*.test.mjs

      - name: Build static bundle (tokenless MapLibre GL JS)
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_MAPBOX_ACCESS_TOKEN: ""
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sar-Madness/sar-Madness/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
