[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-monitor"
version = "0.1.0"
description = "GeoPulse wildfire data ingestion and adaptation (Planetary Computer STAC -> sar-platform / sar-Madness compatible format)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "contourpy>=1.2.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
geopulse = [
    "rasterio>=1.4",
    "pystac-client>=0.8",
